<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-linecap="round">
  <!-- The logo mark from components/logo.tsx, frozen: the mark draws in
       currentColor on the page, so a standalone file picks its colours here.
       The rounded rect is the dark theme's bg-background (neutral-950) in
       every colour scheme; favicon.ico is rasterised from this file. -->
  <rect width="24" height="24" rx="5.25" fill="#0a0a0a"/>
  <!-- The mark, scaled down about the tile's centre for a little breathing
       room against the rounded edges. -->
  <g transform="translate(12 12) scale(0.82) translate(-12 -12)" stroke="#fafafa">
    <path d="M6.34 18.66 A8 8 0 1 1 17.66 18.66" stroke-width="2.5" opacity="0.3"/>
    <!-- Dash in real units (arc length 8 × 3π/2 ≈ 37.7) rather than
         pathLength, which some rasterisers ignore. -->
    <path d="M6.34 18.66 A8 8 0 1 1 17.66 18.66" stroke-width="2.5" stroke-dasharray="37.7" stroke-dashoffset="14.66"/>
    <path d="M12 13 L14.75 8.24" stroke-width="2"/>
    <circle cx="12" cy="13" r="1.75" fill="#fafafa" stroke="none"/>
  </g>
</svg>
